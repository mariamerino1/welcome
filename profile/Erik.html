<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Música de Erik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            color: #ffffff;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 40px 0;
        }

        header h1 {
            font-size: 3em;
            margin: 0;
            font-weight: 700;
        }

        header p {
            font-size: 1.2em;
            font-weight: 300;
            max-width: 600px;
            margin: 10px auto;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        iframe {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        iframe:hover {
            transform: scale(1.05);
        }

    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Bienvenido, soy Erik</h1>
            <p>Me gusta mucho el fútbol, la música y pasar un buen rato. Aquí te dejo algunas de mis canciones favoritas para que las disfrutes.</p>
        </header>

        <main>
            <h2>Escucha mi selección musical:</h2>
            <section class="music-grid">
                <iframe src="https://open.spotify.com/embed/track/3RmFPuTTAjSQ2pbEd2j9oA?utm_source=generator" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
                <iframe src="https://open.spotify.com/embed/track/2UREu1Y8CO4jXkbvqAtP7g?utm_source=generator" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
                <iframe src="https://open.spotify.com/embed/track/72wNM7VYxTZ1PawCKzfTZx?utm_source=generator" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
                <iframe src="https://open.spotify.com/embed/track/0Ot6e3wYVQQ1Us9PM977jE?utm_source=generator" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
                <iframe src="https://open.spotify.com/embed/track/0TFTAtCYhp2tQ9KcJIZb55?utm_source=generator" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
                <iframe src="https://open.spotify.com/embed/track/5hM5arv9KDbCHS0k9uqwjr?utm_source=generator" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
            </section>
        </main>
    </div>
</body>
</html>
