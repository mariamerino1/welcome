<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arnau Caballer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1724;
      color: #e6eef6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #131c2e;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #6ee7b7;
    }

    p {
      color: #cfd8e3;
      line-height: 1.5;
    }

    .info {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #9aa4b2;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Arnau Caballer</h1>
    <p>Tinc 18 anys, sóc de Vinaròs i m'agrada molt la informàtica.</p>
  </div>
</body>
</html>
