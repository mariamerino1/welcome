<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #1DB954;
            text-align: center;
        }

        p {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            color: #bbb;
        }

        .profile {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #fff;
        }

        .profile h2 {
            margin-top: 10px;
            font-size: 2rem;
            color: #f1c40f;
        }

        .profile p {
            font-size: 1.1rem;
            color: #ddd;
        }

        .fc-barcelona {
            width: 150px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Tarjeta Spotify */
        .spotify-card {
            background-color: #2b2b2b;
            color: white;
            width: 300px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: 30px;
        }

        .spotify-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.5);
        }

        .spotify-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 24px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .spotify-card:hover .spotify-icon {
            opacity: 1;
        }

        .cover {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .spotify-card:hover .cover {
            transform: scale(1.05);
        }

        .title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: left;
            width: 100%;
        }

        .artist {
            color: #b3b3b3;
            font-size: 0.95em;
            margin-bottom: 15px;
            width: 100%;
            text-align: left;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .save {
            display: flex;
            align-items: center;
            font-size: 0.9em;
            color: #b3b3b3;
            cursor: pointer;
            transition: color 0.3s;
        }

        .save::before {
            content: "+";
            font-weight: bold;
            margin-right: 6px;
            color: white;
        }

        .save:hover {
            color: white;
        }

        .play-button {
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s, transform 0.2s;
        }

        .play-button::before {
            content: "▶";
            color: black;
            font-size: 20px;
            margin-left: 3px;
            transition: transform 0.2s;
        }

        .play-button:hover {
            background-color: #1db954;
            transform: scale(1.1);
        }

        .play-button:hover::before {
            color: white;
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <h1>Bienvenido a mi página</h1>
    <p>Soy Jan, estudiante de ASIX, que le gusta el fútbol, entrenar y el aprendizaje constante.</p>
